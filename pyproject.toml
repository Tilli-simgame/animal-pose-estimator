[project]
name = "horse-conformation"
version = "0.1.0"
description = "Horse conformation analysis from a single side-view photo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deeplabcut>=3.0.2",
    "fastapi>=0.142.2",
    "numpy>=1.26",
    "pillow>=10",
    "python-multipart>=0.0.32",
    "torch>=2.7",
    "torchvision",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.uv.sources]
# Windows dev machine: RTX 50-series (Blackwell) needs CUDA 12.8 wheels.
# Linux server (Docker): CPU-only wheels, several GB smaller; inference is ~1-3 s per photo.
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
